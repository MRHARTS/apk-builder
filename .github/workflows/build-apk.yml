name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build id"
        required: true
      app_name:
        description: "App name"
        required: true
      app_id:
        description: "Package name like com.example.app"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ inputs.build_id }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          cp -r "../builds/$BUILD_ID/." www/
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin duplicate classes
        run: |
          printf "\ndependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')\n}\n" >> app/android/app/build.gradle

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
