<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Mobile App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.25rem;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #6366f1;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
      background: #4f46e5;
    }
    .counter {
      font-size: 2.25rem;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Android APK</h1>
    <p>This is a complete self-contained HTML website converted into a genuine installable Android application.</p>
    <button onclick="increment()">Tap Me</button>
    <div class="counter" id="count">0</div>
  </div>

  <script>
    let count = 0;
    function increment() {
      count++;
      document.getElementById('count').innerText = count;
    }
  </script>
</body>
</html>
